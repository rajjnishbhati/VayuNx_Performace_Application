[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vayunx-profiler"
version = "0.3.0"
description = "VAYUNX Crypto Profiler: service (FastAPI), Lab, and Python SDKs - standalone proof of concept"
requires-python = ">=3.10"
dependencies = [
    # SDK runtime dependency (the SDK itself uses only the stdlib for HTTP)
    "psutil>=5.9",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "pydantic>=2.6", "opentelemetry-proto==1.44.0",
           "alembic>=1.13", "PyJWT[crypto]>=2.8", "reportlab>=4.2"]
# Postgres driver (VAYUNX_PROFILER_DB_URL=postgresql+psycopg://...)
postgres = ["psycopg[binary]>=3.2"]
# the OpenTelemetry-based SDK (`vayunx` package, spec F)
otel = ["opentelemetry-api==1.44.0", "opentelemetry-sdk==1.44.0", "opentelemetry-exporter-otlp-proto-http==1.44.0",
        "opentelemetry-proto==1.44.0"]
demo = ["argon2-cffi>=23.1"]
lab = ["argon2-cffi>=23.1", "bcrypt>=4.1"]
# test = hook tests for every library the SDK instruments
test = ["pytest>=8", "passlib>=1.7", "PyNaCl>=1.5", "PyJWT>=2.8", "cryptography>=42"]

[project.scripts]
vayunx-run = "vayunx.__main__:run_main"
vayunx-gate = "vayunx.gate:main"

[tool.setuptools]
packages = ["vayunx", "vayunx._bootstrap", "vayunx_profiler_sdk", "profiler_service", "profiler_service.migrations",
            "profiler_service.migrations.versions", "vayunx_lab"]

[tool.setuptools.package-data]
"profiler_service.migrations" = ["alembic.ini", "script.py.mako"]
vayunx_lab = ["node/worker.mjs", "node/package.json", "node/package-lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
